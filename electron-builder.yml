appId: com.ekagram.app
productName: Ekagram
publish:
  provider: github
  owner: SreeshanthT
  repo: Pomodoro
  releaseType: release
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts}'
asarUnpack:
  - resources/**
win:
  target: nsis
  executableName: Ekagram
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Utility
