<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#04050c"/>
      <stop offset="55%" stop-color="#0b0f24"/>
      <stop offset="100%" stop-color="#151a3a"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
    <filter id="blurStar" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="800" height="1400" fill="url(#bg)"/>
  <ellipse cx="600" cy="300" rx="300" ry="240" fill="#3a3f8a" opacity="0.45" filter="url(#blur1)"/>
  <ellipse cx="150" cy="1150" rx="320" ry="260" fill="#241a4d" opacity="0.55" filter="url(#blur1)"/>
  <g fill="#dfe4ff" filter="url(#blurStar)">
    <circle cx="120" cy="180" r="2"/>
    <circle cx="260" cy="90" r="1.6"/>
    <circle cx="520" cy="160" r="2.2"/>
    <circle cx="700" cy="260" r="1.5"/>
    <circle cx="640" cy="70" r="1.8"/>
    <circle cx="80" cy="520" r="1.6"/>
    <circle cx="740" cy="600" r="2"/>
    <circle cx="420" cy="60" r="1.4"/>
    <circle cx="330" cy="700" r="1.8"/>
    <circle cx="600" cy="900" r="1.5"/>
    <circle cx="180" cy="820" r="1.7"/>
    <circle cx="720" cy="1000" r="1.4"/>
  </g>
</svg>
