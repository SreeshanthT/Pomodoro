    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="260" cy="200" rx="380" ry="320" fill="#2a3170" opacity="0.4" filter="url(#blur2)"/>
  <ellipse cx="1320" cy="200" rx="420" ry="340" fill="#5b73d7" opacity="0.3" filter="url(#blur1)"/>
  <ellipse cx="800" cy="500" rx="460" ry="360" fill="#232a64" opacity="0.35" filter="url(#blur2)"/>
  <ellipse cx="220" cy="740" rx="400" ry="320" fill="#141736" opacity="0.45" filter="url(#blur1)"/>
  <ellipse cx="1360" cy="740" rx="420" ry="340" fill="#4a5bb0" opacity="0.3" filter="url(#blur2)"/>
  <g fill="#c7cbf0" filter="url(#starBlur)" opacity="0.7">
    <circle cx="120" cy="120" r="2.4"/>
    <circle cx="420" cy="70" r="1.8"/>
    <circle cx="920" cy="100" r="2.6"/>
    <circle cx="1200" cy="60" r="1.8"/>
    <circle cx="1480" cy="140" r="2"/>
    <circle cx="60" cy="420" r="1.8"/>
    <circle cx="700" cy="200" r="2.4"/>
    <circle cx="1080" cy="300" r="1.6"/>
    <circle cx="1550" cy="420" r="2"/>
    <circle cx="340" cy="500" r="1.8"/>
    <circle cx="960" cy="650" r="2"/>
    <circle cx="1420" cy="600" r="1.6"/>
