  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="260" cy="200" rx="380" ry="320" fill="#215d40" opacity="0.4" filter="url(#blur2)"/>
  <ellipse cx="1300" cy="180" rx="420" ry="340" fill="#2fbf8f" opacity="0.3" filter="url(#blur1)"/>
  <ellipse cx="800" cy="480" rx="460" ry="360" fill="#1c4a33" opacity="0.35" filter="url(#blur2)"/>
  <ellipse cx="220" cy="750" rx="400" ry="320" fill="#0f2a1c" opacity="0.45" filter="url(#blur1)"/>
  <ellipse cx="1360" cy="760" rx="420" ry="340" fill="#337e5c" opacity="0.3" filter="url(#blur2)"/>
</svg>
