<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1f18"/>
      <stop offset="55%" stop-color="#123a2c"/>
      <stop offset="100%" stop-color="#1d5c46"/>
